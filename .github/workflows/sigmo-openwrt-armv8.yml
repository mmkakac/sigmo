# sigmo 社区版 —— OpenWrt ARMv8 (aarch64) 二进制编译 workflow
#
# 放置位置：仓库根目录 .github/workflows/sigmo-openwrt-armv8.yml
# 触发方式：手动触发（workflow_dispatch），或推送 v* 标签时触发并上传产物
#
# 为什么需要 cgo + 静态链接（重要）：
#   上游在 esimtransfer 里引入了 wwan-go/ccid -> goscard -> ebitengine/purego。
#   purego 在 CGO_ENABLED=0 时会启用 internal/fakecgo，通过
#   //go:cgo_import_dynamic 声明 libc.so.6 / libdl.so.2 / libpthread.so.0。
#   于是产出的二进制会在 ELF 里带 INTERP=/lib/ld-linux-aarch64.so.1，
#   在 OpenWrt（musl，无 glibc 加载器）上执行就变成 "sigmo: not found"。
#
#   所以这里改为 CGO_ENABLED=1 + aarch64 交叉编译器 + 外部链接静态化：
#   purego 在 cgo=1 时走真实 cgo（不再生成动态导入声明），
#   配合 -linkmode external -extldflags '-static' 得到完全静态的可执行文件，
#   OpenWrt 上无需任何 libc / 加载器依赖。

name: Build sigmo for OpenWrt ARMv8 (aarch64)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-openwrt-armv8:
    name: Build sigmo (community) static armv8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun (build frontend)
        uses: oven-sh/setup-bun@v2

      # go-version-file 会按 go.mod 自动安装需要的 Go 工具链
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version

      - name: Build frontend
        run: |
          cd apps/web
          bun install --frozen-lockfile
          bun run build --mode prod

      - name: Generate assets (carrier/euicc/sqlc)
        run: go generate ./...

      - name: Build static OpenWrt armv8 binary
        run: |
          set -euo pipefail
          version="dev-${GITHUB_SHA::8}"
          distribution="developer"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            distribution="standalone"
          fi
          ldflags="-w -s"
          ldflags+=" -X github.com/damonto/sigmo/internal/app/buildinfo.Version=${version}"
          ldflags+=" -X github.com/damonto/sigmo/internal/app/buildinfo.Commit=${GITHUB_SHA}"
          ldflags+=" -X github.com/damonto/sigmo/internal/app/buildinfo.Channel=stable"
          ldflags+=" -X github.com/damonto/sigmo/internal/app/buildinfo.Target=linux-arm64"
          ldflags+=" -X github.com/damonto/sigmo/internal/app/buildinfo.Distribution=${distribution}"
          # netgo / osusergo：避免静态 glibc 触发 NSS、getpwnam 之类的动态行为
          # -linkmode external -extldflags '-static'：交给交叉编译器做全静态链接
          # 二进制固定命名为 sigmo
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -tags "netgo osusergo" -trimpath \
            -ldflags "-linkmode external -extldflags '-static' ${ldflags}" -o sigmo .
          # 版本号命名的 txt：内容提示版本号和架构
          printf 'sigmo %s\nArchitecture: linux-arm64 (aarch64)\nChannel: stable\n' "${version}" > "${version}.txt"
          # 压缩包带版本号；包内只有 sigmo 二进制 + 版本号 txt
          zip -r "sigmo-${version}-linux-arm64-openwrt.zip" sigmo "${version}.txt"
          ls -l sigmo "${version}.txt" "sigmo-${version}-linux-arm64-openwrt.zip"

      - name: Verify binary is fully static
        run: |
          file sigmo
          # 必须是 statically linked；若出现 interpreter / dynamically linked，直接失败，
          # 避免再产出在 OpenWrt 上 "not found" 的二进制
          if ! file sigmo | grep -q 'statically linked'; then
            echo "ERROR: binary is not statically linked" >&2
            readelf -l sigmo | grep -A1 INTERP || true
            readelf -d sigmo || true
            exit 1
          fi
          if readelf -l sigmo | grep -q INTERP; then
            echo "ERROR: INTERP section present" >&2
            exit 1
          fi
          echo "OK: fully static, no interpreter"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sigmo-linux-arm64-openwrt
          path: sigmo-*.zip
          if-no-files-found: error