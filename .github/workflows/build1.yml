name: Build sigmo OpenWrt ARMv8
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装Node，编译前端，生成apps/web/dist
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web frontend (generate dist)
        working-directory: ./apps/web
        run: |
          npm install
          npm run build

      # 2. 安装Go，交叉编译aarch64
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build aarch64(ARMv8 musl) binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -o sigmo .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigmo-aarch64-openwrt
          path: sigmo
