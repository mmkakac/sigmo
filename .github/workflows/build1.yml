name: Build sigmo for OpenWrt ARMv8

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 方案 A：如果项目是 Go 语言，请使用此 Job
  # ==========================================
  build-go:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 请根据项目 go.mod 中的实际版本进行修改

      - name: Build for OpenWrt ARMv8 (aarch64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0 # 纯 Go 项目建议禁用 CGO 以实现静态编译
        run: |
          go build -ldflags="-s -w" -o sigmo-linux-arm64

      - name: Upload Go artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigmo-go-openwrt-armv8
          path: sigmo-linux-arm64

